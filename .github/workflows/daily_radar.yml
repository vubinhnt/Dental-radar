name: Dental Radar Daily Pipeline

on:
  schedule:
    # 23:00 UTC = 06:00 sáng giờ Việt Nam mỗi ngày
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Cào dữ liệu tự động (Tạo raw_posts.json)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python collector.py

      - name: 2. Phân tích qua Gemini Flash & Xuất HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline.py

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải thư mục dist lên Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
